<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Polish A1 Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0d0d0d}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eee;min-height:100vh}

.page-switch{
  position:sticky;top:0;z-index:50;
  display:flex;gap:8px;padding:10px 12px;
  background:#0d0d0d;border-bottom:0.5px solid #2a2a2a;
}
.page-btn{
  flex:1;padding:10px 8px;border-radius:12px;border:0.5px solid #2a2a2a;
  background:#161616;color:#888;font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.15s;
}
.page-btn.active{background:#1e1e1e;color:#fff;border-color:#555}

.app{padding:1rem 0.85rem 2.5rem;max-width:560px;margin:0 auto}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.1rem;justify-content:center}
.tab{padding:6px 12px;border-radius:18px;border:0.5px solid #333;background:transparent;color:#888;font-size:12px;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.tab.active{background:#1e1e1e;color:#e8e8e8;border-color:#555}
.tab:active{transform:scale(0.96)}

.hint{font-size:11px;color:#555;text-align:center;margin-bottom:1rem;letter-spacing:0.04em;text-transform:uppercase}

.scene{perspective:1000px;width:100%;margin:0 auto 1.2rem;height:min(54vh,300px);cursor:pointer;touch-action:pan-y}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(.4,0,.2,1)}
.inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:0.5px solid #2a2a2a;background:#161616;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;text-align:center;overflow:auto}
.back{transform:rotateY(180deg);background:#181818}

.face-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#444;margin-bottom:8px}
.polish-text{font-size:clamp(18px,5.5vw,24px);font-weight:600;color:#f5f5f5;margin-bottom:4px;line-height:1.35}
.pron{font-size:12px;color:#777;font-style:italic;margin-bottom:6px}

/* TTS button */
.tts-btn{
  display:inline-flex;align-items:center;gap:5px;
  margin:4px auto 6px;padding:5px 14px;border-radius:20px;
  border:0.5px solid #2e2e2e;background:#1a1a1a;color:#888;
  font-size:11px;cursor:pointer;letter-spacing:0.04em;
  transition:all 0.15s;
}
.tts-btn:active{background:#222;color:#ccc}
.tts-btn.speaking{border-color:#4a6a7c;color:#6aaccc}
.tts-btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}

/* Arabic TTS button - slightly different style */
.tts-btn.arabic{border-color:#6a8a6a;color:#6aaccc}
.tts-btn.arabic:active{background:#222;color:#6aff99}
.tts-btn.arabic.speaking{border-color:#6aff99;color:#6aff99}

.keyword{display:inline-block;font-size:11px;padding:3px 12px;border-radius:12px;letter-spacing:0.03em;margin-bottom:4px}
.theme-tag{font-size:11px;color:#444;margin-top:2px}
.arabic-text{font-size:clamp(18px,5.5vw,24px);color:#e8dfc8;direction:rtl;margin-bottom:4px;line-height:1.6;font-weight:500}

/* Arabic transliteration (how to read Arabic in English) */
.arab-translit{font-size:12px;color:#6a8a6a;font-style:italic;margin-bottom:6px;direction:ltr;letter-spacing:0.02em}
.arab-translit-label{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:#333;margin-bottom:1px}

.english-text{font-size:13px;color:#666}
.divider{width:32px;height:1px;background:#2a2a2a;margin:6px auto}
.flip-hint{font-size:11px;color:#333;margin-top:8px;letter-spacing:0.06em;text-transform:uppercase}

.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:0.9rem}
.nav-btn{flex:1;max-width:140px;padding:13px 10px;border-radius:12px;border:0.5px solid #2a2a2a;background:#161616;color:#ccc;font-size:15px;cursor:pointer;transition:all 0.15s}
.nav-btn:active{transform:scale(0.96);background:#1e1e1e}
.prog{font-size:13px;color:#555;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

.shuffle{display:block;margin:0 auto;padding:8px 22px;border-radius:20px;border:0.5px solid #2a2a2a;background:transparent;color:#555;font-size:12px;cursor:pointer}
.shuffle:active{background:#1a1a1a}

/* TTS not available notice */
.tts-notice{font-size:10px;color:#3a3a3a;text-align:center;margin-top:6px}

@media(min-width:600px){
  .nav-btn{font-size:14px;padding:10px 24px;max-width:160px}
}
</style>
</head>
<body>

<div class="page-switch">
  <button class="page-btn active" id="btnPage1" onclick="switchPage(1)">🇵🇱 → 🇸🇦 Learn</button>
  <button class="page-btn" id="btnPage2" onclick="switchPage(2)">🇸🇦 → 🇵🇱 Guess</button>
</div>

<!-- PAGE 1: Polish front -->
<div class="app" id="page1">
  <div class="tabs" id="tabs1"></div>
  <p class="hint">tap card to flip · ‹ › to move</p>
  <div class="scene" id="scene1" onclick="flip1()">
    <div class="inner" id="inner1">
      <div class="face front">
        <div class="face-label">Polish</div>
        <div class="polish-text" id="fp"></div>
        <div class="pron" id="fr"></div>
        <button class="tts-btn" id="ttsBtn1" onclick="event.stopPropagation();speakPolish(1)">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          Listen
        </button>
        <div class="divider"></div>
        <div class="keyword" id="fk"></div>
        <div class="theme-tag" id="ft"></div>
        <div class="flip-hint">tap to reveal</div>
      </div>
      <div class="face back">
        <div class="face-label">Translation</div>
        <div class="arabic-text" id="ba"></div>
        <button class="tts-btn arabic" id="arabicBtn1" onclick="event.stopPropagation();speakArabic(1)">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          Listen Arabic
        </button>
        <div class="arab-translit-label">كيف تُقرأ بالحروف اللاتينية</div>
        <div class="arab-translit" id="bat"></div>
        <div class="divider"></div>
        <div class="english-text" id="be"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" onclick="prev1()">‹ Prev</button>
    <span class="prog" id="prog1"></span>
    <button class="nav-btn" onclick="next1()">Next ›</button>
  </div>
  <button class="shuffle" onclick="shuffleDeck1()">⇄ Shuffle deck</button>
  <p class="tts-notice" id="ttsNotice1"></p>
</div>

<!-- PAGE 2: Arabic front, guess Polish -->
<div class="app" id="page2" style="display:none">
  <div class="tabs" id="tabs2"></div>
  <p class="hint">guess the Polish, then reveal</p>
  <div class="scene" id="scene2" onclick="flip2()">
    <div class="inner" id="inner2">
      <div class="face front">
        <div class="face-label">Arabic / English</div>
        <div class="arabic-text" id="rba"></div>
        <button class="tts-btn arabic" id="arabicBtn2Front" onclick="event.stopPropagation();speakArabic(2)">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          Listen Arabic
        </button>
        <div class="arab-translit-label">كيف تُقرأ بالحروف اللاتينية</div>
        <div class="arab-translit" id="rbat"></div>
        <div class="divider"></div>
        <div class="english-text" id="rbe"></div>
        <div class="flip-hint">tap to reveal Polish</div>
      </div>
      <div class="face back">
        <div class="face-label">Polish</div>
        <div class="polish-text" id="rfp"></div>
        <div class="pron" id="rfr"></div>
        <button class="tts-btn" id="ttsBtn2" onclick="event.stopPropagation();speakPolish(2)">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          Listen
        </button>
        <div class="divider"></div>
        <div class="keyword" id="rfk"></div>
        <div class="theme-tag" id="rft"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" onclick="prev2()">‹ Prev</button>
    <span class="prog" id="prog2"></span>
    <button class="nav-btn" onclick="next2()">Next ›</button>
  </div>
  <button class="shuffle" onclick="shuffleDeck2()">⇄ Shuffle deck</button>
  <p class="tts-notice" id="ttsNotice2"></p>
</div>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== TTS (Text-to-Speech) — 100% free, built into the browser ===== */
let ttsReady=false;
let arabicReady=false;
let polishVoice=null;
let arabicVoice=null;

function initTTS(){
  if(!('speechSynthesis' in window)){
    document.getElementById("ttsNotice1").textContent="🔇 Text-to-speech not supported in this browser.";
    document.getElementById("ttsNotice2").textContent="🔇 Text-to-speech not supported in this browser.";
    return;
  }
  function pickVoices(){
    const voices=window.speechSynthesis.getVoices();
    // Try to find a Polish voice
    polishVoice=voices.find(v=>v.lang==="pl-PL")||voices.find(v=>v.lang.startsWith("pl"))||null;
    // Try to find an Arabic voice
    arabicVoice=voices.find(v=>v.lang==="ar-SA")||voices.find(v=>v.lang.startsWith("ar"))||null;
    
    if(polishVoice){
      ttsReady=true;
      document.getElementById("ttsNotice1").textContent="🔊 Polish voice: "+polishVoice.name;
      document.getElementById("ttsNotice2").textContent="🔊 Polish voice: "+polishVoice.name;
    } else if(voices.length>0){
      ttsReady=true;
      document.getElementById("ttsNotice1").textContent="⚠️ No Polish voice found — using default voice.";
      document.getElementById("ttsNotice2").textContent="⚠️ No Polish voice found — using default voice.";
    }
    
    if(arabicVoice){
      arabicReady=true;
    }
  }
  pickVoices();
  window.speechSynthesis.onvoiceschanged=pickVoices;
}

function speakPolish(page){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const text=page===1?deck1[cur1].p:deck2[cur2].p;
  const btn=document.getElementById("ttsBtn"+page);
  const utt=new SpeechSynthesisUtterance(text);
  if(polishVoice)utt.voice=polishVoice;
  utt.lang="pl-PL";
  utt.rate=0.85;
  utt.pitch=1;
  btn.classList.add("speaking");
  btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16.5 3v2.23c2.89 1.1 5 3.9 5 7.27s-2.11 6.17-5 7.27V22c4.01-1.26 7-5.1 7-9.5s-2.99-8.24-7-9.5z"/></svg> Listening`;
  utt.onend=()=>{
    btn.classList.remove("speaking");
    btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen`;
  };
  utt.onerror=()=>{
    btn.classList.remove("speaking");
    btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen`;
  };
  window.speechSynthesis.speak(utt);
}

function speakArabic(page){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  let btnId,text;
  if(page===1){
    text=deck1[cur1].a;
    btnId="arabicBtn1";
  } else {
    text=deck2[cur2].a;
    btnId="arabicBtn2Front";
  }
  const btn=document.getElementById(btnId);
  const utt=new SpeechSynthesisUtterance(text);
  if(arabicVoice)utt.voice=arabicVoice;
  utt.lang="ar-SA";
  utt.rate=0.8;
  utt.pitch=1;
  btn.classList.add("speaking");
  btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16.5 3v2.23c2.89 1.1 5 3.9 5 7.27s-2.11 6.17-5 7.27V22c4.01-1.26 7-5.1 7-9.5s-2.99-8.24-7-9.5z"/></svg> Listening`;
  utt.onend=()=>{
    btn.classList.remove("speaking");
    btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen Arabic`;
  };
  utt.onerror=()=>{
    btn.classList.remove("speaking");
    btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen Arabic`;
  };
  window.speechSynthesis.speak(utt);
}

/* ===== PAGE 1 ===== */
let cur1=0,flipped1=false,deck1=[...all];

function buildTabs1(){
  const wrap=document.getElementById("tabs1");
  wrap.innerHTML="";
  themes.forEach(th=>{
    const b=document.createElement("button");
    b.className="tab"+(th.id==="all"?" active":"");
    const count=th.id==="all"?all.length:all.filter(c=>c.t===th.id).length;
    b.innerHTML=`${th.icon?th.icon+" ":""}${th.label} <span style="opacity:0.45;font-size:10px">${count}</span>`;
    b.onclick=()=>selectTheme1(th.id,b);
    wrap.appendChild(b);
  });
}
function selectTheme1(id,btn){
  document.querySelectorAll("#tabs1 .tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  deck1=id==="all"?[...all]:all.filter(c=>c.t===id);
  cur1=0;flipped1=false;
  document.getElementById("inner1").classList.remove("flipped");
  render1();
}
function render1(){
  const c=deck1[cur1];
  document.getElementById("fp").textContent=c.p;
  document.getElementById("fr").textContent=c.r;
  const col=themeColors[c.t]||"#555";
  const fk=document.getElementById("fk");
  fk.textContent=c.k;
  fk.style.background=col+"22";
  fk.style.color=col;
  fk.style.borderColor=col+"44";
  document.getElementById("ft").textContent=themeLabels[c.t]||"";
  document.getElementById("ba").textContent=c.a;
  document.getElementById("bat").textContent=c.at||"";
  document.getElementById("be").textContent=c.e;
  document.getElementById("prog1").textContent=(cur1+1)+" / "+deck1.length;
  // reset TTS buttons
  const btn=document.getElementById("ttsBtn1");
  btn.classList.remove("speaking");
  btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen`;
  const abtn=document.getElementById("arabicBtn1");
  abtn.classList.remove("speaking");
  abtn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen Arabic`;
}
function flip1(){
  flipped1=!flipped1;
  document.getElementById("inner1").classList.toggle("flipped",flipped1);
}
function next1(){window.speechSynthesis&&window.speechSynthesis.cancel();cur1=(cur1+1)%deck1.length;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}
function prev1(){window.speechSynthesis&&window.speechSynthesis.cancel();cur1=(cur1-1+deck1.length)%deck1.length;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}
function shuffleDeck1(){shuffle(deck1);cur1=0;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}

/* ===== Page switcher ===== */
function switchPage(n){
  document.getElementById("page1").style.display=n===1?"block":"none";
  document.getElementById("page2").style.display=n===2?"block":"none";
  document.getElementById("btnPage1").classList.toggle("active",n===1);
  document.getElementById("btnPage2").classList.toggle("active",n===2);
  window.speechSynthesis&&window.speechSynthesis.cancel();
}

/* ===== Keyboard navigation ===== */
document.addEventListener("keydown",e=>{
  const p1=document.getElementById("page1").style.display!=="none";
  if(e.key==="ArrowRight"||e.key==="l"||e.key==="L"){p1?next1():next2();}
  else if(e.key==="ArrowLeft"||e.key==="h"||e.key==="H"){p1?prev1():prev2();}
  else if(e.key===" "||e.key==="f"||e.key==="F"){e.preventDefault();p1?flip1():flip2();}
});

/* ===== Init ===== */
buildTabs1();
buildTabs2();
render1();
render2();
initTTS();
</script>
