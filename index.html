<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Polish A1 Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0d0d0d}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eee;min-height:100vh}

/* ===== Page switcher ===== */
.page-switch{
  position:sticky;top:0;z-index:50;
  display:flex;gap:8px;padding:10px 12px;
  background:#0d0d0d;border-bottom:0.5px solid #2a2a2a;
}
.page-btn{
  flex:1;padding:10px 8px;border-radius:12px;border:0.5px solid #2a2a2a;
  background:#161616;color:#888;font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.15s;
}
.page-btn.active{background:#1e1e1e;color:#fff;border-color:#555}

.app{padding:1rem 0.85rem 2.5rem;max-width:560px;margin:0 auto}

/* ===== Theme tabs ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.1rem;justify-content:center}
.tab{padding:6px 12px;border-radius:18px;border:0.5px solid #333;background:transparent;color:#888;font-size:12px;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.tab.active{background:#1e1e1e;color:#e8e8e8;border-color:#555}
.tab:active{transform:scale(0.96)}

.hint{font-size:11px;color:#555;text-align:center;margin-bottom:1rem;letter-spacing:0.04em;text-transform:uppercase}

/* ===== Card ===== */
.scene{perspective:1000px;width:100%;margin:0 auto 1.2rem;height:min(48vh,260px);cursor:pointer;touch-action:pan-y}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(.4,0,.2,1)}
.inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:0.5px solid #2a2a2a;background:#161616;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem 1.2rem;text-align:center}
.back{transform:rotateY(180deg);background:#181818}
.face-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#444;margin-bottom:10px}
.polish-text{font-size:clamp(20px,6vw,26px);font-weight:600;color:#f5f5f5;margin-bottom:8px;line-height:1.35}
.pron{font-size:13px;color:#777;font-style:italic;margin-bottom:8px}
.keyword{display:inline-block;font-size:11px;padding:3px 12px;border-radius:12px;letter-spacing:0.03em;margin-bottom:6px}
.theme-tag{font-size:11px;color:#444;margin-top:4px}
.arabic-text{font-size:clamp(20px,6vw,26px);color:#e8dfc8;direction:rtl;margin-bottom:8px;line-height:1.6;font-weight:500}
.english-text{font-size:14px;color:#666}
.flip-hint{font-size:11px;color:#333;margin-top:12px;letter-spacing:0.06em;text-transform:uppercase}

/* ===== Controls ===== */
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:0.9rem}
.nav-btn{flex:1;max-width:140px;padding:13px 10px;border-radius:12px;border:0.5px solid #2a2a2a;background:#161616;color:#ccc;font-size:15px;cursor:pointer;transition:all 0.15s}
.nav-btn:active{transform:scale(0.96);background:#1e1e1e}
.prog{font-size:13px;color:#555;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

.shuffle{display:block;margin:0 auto;padding:8px 22px;border-radius:20px;border:0.5px solid #2a2a2a;background:transparent;color:#555;font-size:12px;cursor:pointer}
.shuffle:active{background:#1a1a1a}

.divider{width:32px;height:1px;background:#2a2a2a;margin:8px auto}

/* ===== Reveal button for reverse mode ===== */
.reveal-btn{
  display:block;margin:0 auto 0.9rem;padding:11px 28px;border-radius:12px;
  border:0.5px solid #3a3a3a;background:#1a1a1a;color:#bbb;font-size:14px;
  cursor:pointer;letter-spacing:0.03em;
}
.reveal-btn:active{background:#222}

@media (min-width:600px){
  .nav-btn{font-size:14px;padding:10px 24px;max-width:160px}
}
</style>
</head>
<body>

<div class="page-switch">
  <button class="page-btn active" id="btnPage1" onclick="switchPage(1)">🇵🇱 → 🇸🇦 Learn</button>
  <button class="page-btn" id="btnPage2" onclick="switchPage(2)">🇸🇦 → 🇵🇱 Guess</button>
</div>

<!-- ============ PAGE 1: Polish front, translation back ============ -->
<div class="app" id="page1">
  <div class="tabs" id="tabs1"></div>
  <p class="hint">tap card to flip · ‹ › to move</p>
  <div class="scene" id="scene1" onclick="flip1()">
    <div class="inner" id="inner1">
      <div class="face front">
        <div class="face-label">Polish</div>
        <div class="polish-text" id="fp"></div>
        <div class="pron" id="fr"></div>
        <div class="divider"></div>
        <div class="keyword" id="fk"></div>
        <div class="theme-tag" id="ft"></div>
        <div class="flip-hint">tap to reveal</div>
      </div>
      <div class="face back">
        <div class="face-label">Translation</div>
        <div class="arabic-text" id="ba"></div>
        <div class="divider"></div>
        <div class="english-text" id="be"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" onclick="prev1()">‹ Prev</button>
    <span class="prog" id="prog1"></span>
    <button class="nav-btn" onclick="next1()">Next ›</button>
  </div>
  <button class="shuffle" onclick="shuffleDeck1()">⇄ Shuffle deck</button>
</div>

<!-- ============ PAGE 2: Arabic front, guess Polish ============ -->
<div class="app" id="page2" style="display:none">
  <div class="tabs" id="tabs2"></div>
  <p class="hint">guess the Polish, then reveal</p>
  <div class="scene" id="scene2" onclick="flip2()">
    <div class="inner" id="inner2">
      <div class="face front">
        <div class="face-label">Arabic / English</div>
        <div class="arabic-text" id="rba"></div>
        <div class="divider"></div>
        <div class="english-text" id="rbe"></div>
        <div class="flip-hint">tap to reveal Polish</div>
      </div>
      <div class="face back">
        <div class="face-label">Polish</div>
        <div class="polish-text" id="rfp"></div>
        <div class="pron" id="rfr"></div>
        <div class="divider"></div>
        <div class="keyword" id="rfk"></div>
        <div class="theme-tag" id="rft"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" onclick="prev2()">‹ Prev</button>
    <span class="prog" id="prog2"></span>
    <button class="nav-btn" onclick="next2()">Next ›</button>
  </div>
  <button class="shuffle" onclick="shuffleDeck2()">⇄ Shuffle deck</button>
</div>

const themes=[
  {id:"all",label:"All",icon:""},
  {id:"daily",label:"Daily life",icon:"🏠"},
  {id:"transit",label:"Getting around",icon:"🚌"},
  {id:"food",label:"Food & cafes",icon:"☕"},
  {id:"shop",label:"Shopping",icon:"🛍"},
  {id:"social",label:"Small talk",icon:"💬"},
];
const themeColors={daily:"#4a7c59",transit:"#4a6a7c",food:"#7c6a4a",shop:"#7c4a6a",social:"#4a4a7c"};
const themeLabels={daily:"🏠 Daily life",transit:"🚌 Getting around",food:"☕ Food & cafes",shop:"🛍 Shopping",social:"💬 Small talk"};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= PAGE 1 (Polish -> translation) ================= */
let cur1=0, flipped1=false, deck1=[...all];

function buildTabs1(){
  const wrap=document.getElementById("tabs1");
  wrap.innerHTML="";
  themes.forEach(th=>{
    const b=document.createElement("button");
    b.className="tab"+(th.id==="all"?" active":"");
    const count=th.id==="all"?all.length:all.filter(c=>c.t===th.id).length;
    b.innerHTML=`${th.icon?th.icon+" ":""}${th.label} <span style="opacity:0.45;font-size:10px">${count}</span>`;
    b.onclick=()=>selectTheme1(th.id,b);
    wrap.appendChild(b);
  });
}
function selectTheme1(id,btn){
  document.querySelectorAll("#tabs1 .tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  deck1=id==="all"?[...all]:all.filter(c=>c.t===id);
  cur1=0;flipped1=false;
  document.getElementById("inner1").classList.remove("flipped");
  render1();
}
function render1(){
  const c=deck1[cur1];
  document.getElementById("fp").textContent=c.p;
  document.getElementById("fr").textContent=c.r;
  const kw=document.getElementById("fk");
  kw.textContent=c.k;
  kw.style.background=(themeColors[c.t]||"#5d9e5d")+"22";
  kw.style.color=themeColors[c.t]||"#5d9e5d";
  document.getElementById("ft").textContent=themeLabels[c.t]||"";
  document.getElementById("ba").textContent=c.a;
  document.getElementById("be").textContent=c.e;
  document.getElementById("prog1").textContent=(cur1+1)+" / "+deck1.length;
}
function flip1(){flipped1=!flipped1;document.getElementById("inner1").classList.toggle("flipped",flipped1);}
function next1(){cur1=(cur1+1)%deck1.length;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}
function prev1(){cur1=(cur1-1+deck1.length)%deck1.length;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}
function shuffleDeck1(){shuffle(deck1);cur1=0;flipped1=false;document.getElementById("inner1").classList.remove("flipped");render1();}

/* ================= Page switching ================= */
function switchPage(n){
  document.getElementById("page1").style.display = n===1 ? "block":"none";
  document.getElementById("page2").style.display = n===2 ? "block":"none";
  document.getElementById("btnPage1").classList.toggle("active", n===1);
  document.getElementById("btnPage2").classList.toggle("active", n===2);
}

/* ================= Swipe support ================= */
function addSwipe(el, onLeft, onRight, onTap){
  let sx=0, sy=0, moved=false;
  el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  el.addEventListener("touchmove",()=>{moved=true;},{passive:true});
  el.addEventListener("touchend",e=>{
    e.preventDefault();
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0) onLeft(); else onRight();
    } else if(!moved){
      onTap();
    }
  });
}

/* ================= Keyboard ================= */
document.addEventListener("keydown",e=>{
  const onPage1 = document.getElementById("page1").style.display !== "none";
  if(e.key==="ArrowRight") onPage1?next1():next2();
  if(e.key==="ArrowLeft") onPage1?prev1():prev2();
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); onPage1?flip1():flip2();}
});

/* ================= Init ================= */
buildTabs1();render1();
buildTabs2();render2();

addSwipe(document.getElementById("scene1"), next1, prev1, flip1);
addSwipe(document.getElementById("scene2"), next2, prev2, flip2);
</script>
